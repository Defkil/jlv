name: CI and publish

# Every push to master runs the gates and then publishes the tested tarball of jlv, if its version is not on npm yet.
# npm trusted publishing (OIDC) trusts this repository and this workflow file name without a GitHub environment;
# renaming the file or adding an environment needs the trusted publisher on npmjs.com to change first. A manual run
# checks any branch and publishes only on master. docs/release.md describes the release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality (Node 24)
    # Pinned instead of ubuntu-latest, which moves to Ubuntu 26.04 from 2026-10-19; every job uses the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version of package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm

      # No dependency cache: the job that packs the release installs from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The npm of the publish job packs the tarball.
      - name: Install the publishing npm
        run: npm install --global npm@12.2.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:build

      # Packs packages/jlv, checks the tarball's files and manifest, installs it into an empty project and runs the
      # command, a strict TypeScript consumer and plugins; the step outputs name the tarball and its SHA-256.
      - name: Pack and check the package
        id: package
        run: node .test-dist/scripts/check-package.js --pack-destination "$RUNNER_TEMP/package"

      # The decision of the publish job, without publishing: the changelog section, npm's version and the registry.
      - name: Check the release
        run: node scripts/publish-package.ts "$RUNNER_TEMP/package/$FILE" --sha256 "$SHA256" --dry-run
        env:
          FILE: ${{ steps.package.outputs.file }}
          SHA256: ${{ steps.package.outputs.sha256 }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Runtime (Node ${{ matrix.node }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The engines floor, then the latest 22, 24 and 26.
        node: ['22.9.0', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm

      # Install and compile the tests with the contributor runtime...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Verify the tested tarball
        run: echo "$SHA256  $RUNNER_TEMP/package/$FILE" | sha256sum --check --strict
        env:
          FILE: ${{ needs.quality.outputs.file }}
          SHA256: ${{ needs.quality.outputs.sha256 }}

      # ...then run the emitted tests and the installed tarball on the runtime under test, with its own npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false

      - run: node --version && npm --version
      - run: node .test-dist/scripts/run-tests.js

      - name: Install and check the tested tarball
        run: node .test-dist/scripts/check-package.js --tarball "$RUNNER_TEMP/package/$FILE"
        env:
          FILE: ${{ needs.quality.outputs.file }}

  publish:
    name: Publish to npm
    needs: [quality, runtime]
    # Only master publishes; a manual run on another branch ends after the checks.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no token secret
    # One publication at a time; a running publication is never cancelled.
    concurrency:
      group: jlv-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No registry-url: npm authenticates through OIDC, not an .npmrc token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the publishing npm
        run: npm install --global npm@12.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # Verifies the SHA-256, the manifest, the changelog section and npm's version, looks the version up on npm, and
      # publishes exactly this tarball with provenance unless the version is there already.
      - name: Publish the tested tarball
        run: node scripts/publish-package.ts "$RUNNER_TEMP/package/$FILE" --sha256 "$SHA256"
        env:
          FILE: ${{ needs.quality.outputs.file }}
          SHA256: ${{ needs.quality.outputs.sha256 }}
