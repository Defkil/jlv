name: Bug report
description: jlv does something other than its documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Logs often hold personal data, tokens or internal host names: shorten the log to the records that matter and replace such values before you paste it. Security vulnerabilities belong in a private report (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: jlv version
      description: Output of `jlv --version`.
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v24.21.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and terminal
      description: For example Windows 11 on ARM64 with Windows Terminal and PowerShell 7, macOS 15 with iTerm2, Ubuntu 24.04 with GNOME Terminal over SSH.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command line and configuration
      description: The command you ran, how the input reached jlv (file, glob, pipe, --follow), and your jlv.config.json or .json-log-viewer if you use one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sample log
      description: The smallest log that shows the problem, with real data replaced.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: In the viewer, the keys you pressed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the messages on standard error and the exit code.
    validations:
      required: true
